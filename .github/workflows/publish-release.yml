name: Publish Android prerelease

on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android APK run ID from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-android-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
    steps:
      # Never check out or execute code from a triggering run in this privileged job.
      - name: Verify build provenance
        id: build
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('build-run.json', 'utf8'));
          if (run.status !== 'completed' || run.conclusion !== 'success' ||
              run.head_branch !== 'main' || run.head_repository?.full_name !== process.env.GH_REPO ||
              run.path !== '.github/workflows/android-apk.yml' || run.name !== 'Android APK' ||
              !['push', 'workflow_dispatch'].includes(run.event) ||
              !/^[a-f0-9]{40}$/.test(run.head_sha)) {
            throw new Error('Only successful Android APK builds from this repository main branch may publish.');
          }
          const { execFileSync } = require('node:child_process');
          const response = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GH_REPO}/contents/app.json?ref=${run.head_sha}`], { encoding: 'utf8' }));
          const app = JSON.parse(Buffer.from(response.content, 'base64').toString('utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(app.expo.version) || !Number.isSafeInteger(run.run_number) || run.run_number < 1) throw new Error('Invalid release version');
          const version = `${app.expo.version}-alpha.${run.run_number}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\ntag=v${version}\nversion=${version}\n`);
          NODE
      - name: Check for an existing release
        id: existing
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            node -e 'if (JSON.parse(require("fs").readFileSync("existing-release.json")).isDraft) throw new Error("Draft exists; inspect it before retrying publication.")'
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download verified build artifacts
        if: steps.existing.outputs.published != 'true'
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          gh run download "$BUILD_RUN_ID" --name "location-journal-android-$BUILD_SHA" --dir release-files
          test "$(cat release-files/COMMIT.txt)" = "$BUILD_SHA"
          cd release-files
          sha256sum -c SHA256SUMS.txt
      - name: Publish APK with matching source and checksums
        if: steps.existing.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          ## Install on Android
          Download **location-journal-$RELEASE_VERSION.apk** under Assets and open it on your phone. No GitHub login, Expo Go, or development server is needed.

          [Installation and testing guide](https://github.com/$GH_REPO/blob/$BUILD_SHA/docs/android-install.md) · [Build log](https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID)

          Early release signed with the private Location Journal release key. This cannot update an older debug-signed installation; export records before uninstalling that older app. Native compilation passed; physical-device reliability and legal admissibility are not established. Export records before any uninstall or storage reset.

          Built from commit $BUILD_SHA. Matching source, license notices, and SHA-256 checksums are attached. The APK signing key is separate from each device's location-record signing key.
          EOF_NOTES
          gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --prerelease \
            --title "Location Journal $RELEASE_VERSION" --notes-file release-notes.md --generate-notes \
            "release-files/location-journal-$RELEASE_VERSION.apk" release-files/source.tar.gz \
            release-files/SHA256SUMS.txt release-files/COMMIT.txt \
            release-files/LICENSE release-files/THIRD-PARTY-NOTICES
          gh release edit "$RELEASE_TAG" --draft=false
          printf 'Download: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
